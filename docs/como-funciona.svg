<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-label="Como o Unlock GPU funciona: app, serviços, NVML do driver, GPU e leitura de volta">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8A949C"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#BAF568"/>
    </marker>
  </defs>
  <rect width="1200" height="460" rx="22" fill="#14191E"/>
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <text x="40" y="52" fill="#E8ECEF" font-size="26" font-weight="700">Como funciona</text>
    <text x="40" y="82" fill="#8A949C" font-size="16">Tudo passa pela NVML, a biblioteca oficial que vem com o driver da NVIDIA. Cada ajuste é lido de volta do hardware.</text>

    <!-- coluna 1: app -->
    <rect x="40" y="120" width="230" height="290" rx="16" fill="#1E242A" stroke="#2E3740"/>
    <text x="155" y="152" fill="#E8ECEF" font-size="19" font-weight="700" text-anchor="middle">Unlock GPU</text>
    <text x="155" y="174" fill="#8A949C" font-size="13" text-anchor="middle">janela, bandeja, perfis</text>
    <g font-size="14" fill="#D3DAE0">
      <rect x="62" y="194" width="186" height="34" rx="9" fill="#262E36"/><text x="155" y="216" text-anchor="middle">Monitor ao vivo</text>
      <rect x="62" y="236" width="186" height="34" rx="9" fill="#262E36"/><text x="155" y="258" text-anchor="middle">Ajustes e offsets</text>
      <rect x="62" y="278" width="186" height="34" rx="9" fill="#262E36"/><text x="155" y="300" text-anchor="middle">Ajuste automático</text>
      <rect x="62" y="320" width="186" height="34" rx="9" fill="#262E36"/><text x="155" y="342" text-anchor="middle">Sessões e alertas</text>
      <rect x="62" y="362" width="186" height="34" rx="9" fill="#262E36"/><text x="155" y="384" text-anchor="middle">Perfis e backup</text>
    </g>

    <!-- coluna 2: nucleo -->
    <rect x="340" y="120" width="250" height="290" rx="16" fill="#1E242A" stroke="#2E3740"/>
    <text x="465" y="152" fill="#E8ECEF" font-size="19" font-weight="700" text-anchor="middle">Núcleo</text>
    <text x="465" y="174" fill="#8A949C" font-size="13" text-anchor="middle">regras de segurança</text>
    <g font-size="14" fill="#D3DAE0">
      <rect x="362" y="194" width="206" height="34" rx="9" fill="#262E36"/><text x="465" y="216" text-anchor="middle">Faixas sempre do driver</text>
      <rect x="362" y="236" width="206" height="34" rx="9" fill="#262E36"/><text x="465" y="258" text-anchor="middle">Aplica → lê de volta</text>
      <rect x="362" y="278" width="206" height="34" rx="9" fill="#262E36"/><text x="465" y="300" text-anchor="middle">Volta ao último bom</text>
      <rect x="362" y="320" width="206" height="34" rx="9" fill="#262E36"/><text x="465" y="342" text-anchor="middle">Benchmark D3D11</text>
      <rect x="362" y="362" width="206" height="34" rx="9" fill="#262E36"/><text x="465" y="384" text-anchor="middle">Teste de VRAM</text>
    </g>

    <!-- coluna 3: interfaces publicas -->
    <rect x="660" y="120" width="230" height="180" rx="16" fill="#1F2A22" stroke="#3D5A2C"/>
    <text x="775" y="152" fill="#BAF568" font-size="19" font-weight="700" text-anchor="middle">NVML</text>
    <text x="775" y="174" fill="#9BB37E" font-size="13" text-anchor="middle">nvml.dll do driver</text>
    <g font-size="13" fill="#D3DAE0">
      <text x="684" y="204">• potência, clocks, P-state</text>
      <text x="684" y="226">• motivos de corte</text>
      <text x="684" y="248">• offsets de núcleo/memória</text>
      <text x="684" y="270">• trava de clock da VRAM</text>
      <text x="684" y="292">• limite (se o notebook aceitar)</text>
    </g>
    <rect x="660" y="316" width="230" height="94" rx="16" fill="#1E242A" stroke="#2E3740"/>
    <text x="775" y="346" fill="#E8ECEF" font-size="17" font-weight="700" text-anchor="middle">Fabricante (WMI)</text>
    <text x="775" y="370" fill="#8A949C" font-size="13" text-anchor="middle">modo e TGP configurável</text>
    <text x="775" y="392" fill="#8A949C" font-size="13" text-anchor="middle">documentado (Tongfang/Uniwill)</text>

    <!-- coluna 4: hardware -->
    <rect x="960" y="120" width="200" height="290" rx="16" fill="#1E242A" stroke="#2E3740"/>
    <text x="1060" y="152" fill="#E8ECEF" font-size="19" font-weight="700" text-anchor="middle">Notebook</text>
    <g transform="translate(1004 178) scale(0.44)">
      <g stroke="#7FA84A" stroke-width="9" stroke-linecap="round">
        <path d="M92 62v16M116 62v16M140 62v16M164 62v16M92 178v16M116 178v16M140 178v16M164 178v16"/>
        <path d="M62 92h16M62 116h16M62 140h16M62 164h16M178 92h16M178 116h16M178 140h16M178 164h16"/>
      </g>
      <rect x="80" y="80" width="96" height="96" rx="16" fill="#11161B" stroke="#BAF568" stroke-width="9"/>
      <text x="128" y="138" fill="#BAF568" font-size="34" font-weight="800" text-anchor="middle">GPU</text>
    </g>
    <text x="1060" y="320" fill="#D3DAE0" font-size="14" text-anchor="middle">GPU NVIDIA</text>
    <text x="1060" y="342" fill="#8A949C" font-size="13" text-anchor="middle">driver + vBIOS de fábrica</text>
    <text x="1060" y="364" fill="#8A949C" font-size="13" text-anchor="middle">controlador do notebook</text>

    <!-- setas -->
    <path d="M270 265H332" stroke="#8A949C" stroke-width="2.5" marker-end="url(#arr)"/>
    <path d="M590 210H652" stroke="#BAF568" stroke-width="2.5" marker-end="url(#arrG)"/>
    <path d="M652 250H598" stroke="#BAF568" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrG)"/>
    <path d="M890 210H952" stroke="#BAF568" stroke-width="2.5" marker-end="url(#arrG)"/>
    <path d="M952 250H898" stroke="#BAF568" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrG)"/>
    <path d="M590 362H652" stroke="#8A949C" stroke-width="2.5" marker-end="url(#arr)"/>
    <path d="M890 362H952" stroke="#8A949C" stroke-width="2.5" marker-end="url(#arr)"/>
    <text x="621" y="200" fill="#BAF568" font-size="12" text-anchor="middle">aplica</text>
    <text x="625" y="272" fill="#BAF568" font-size="12" text-anchor="middle">lê de volta</text>
  </g>
</svg>
