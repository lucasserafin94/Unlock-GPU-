<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="500" viewBox="0 0 1760 500" role="img" aria-label="Faixas de potência de uma GPU de notebook e onde o Unlock GPU atua, com e sem o kit de offset da vBIOS (casos reais até ~350 W; controle até 400 W)">
  <rect width="1760" height="500" rx="22" fill="#14191E"/>
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <text x="40" y="52" fill="#E8ECEF" font-size="26" font-weight="700">Onde está o potencial escondido</text>
    <text x="40" y="82" fill="#8A949C" font-size="16">Exemplo: RTX 5090 Laptop (família Tongfang/Uniwill). O app libera o teto original; com o kit de offset da vBIOS, o próprio teto sobe — nesta placa, de 175 W para 250 W; em outras, casos reais passam de 300 W.</text>

    <!-- tetos -->
    <line x1="780" y1="96" x2="780" y2="400" stroke="#C96A63" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="780" y="108" fill="#E08D86" font-size="14" font-weight="700" text-anchor="middle">teto original da vBIOS · 175 W</text>
    <line x1="1480" y1="96" x2="1480" y2="400" stroke="#BAF568" stroke-width="3"/>
    <text x="1480" y="108" fill="#BAF568" font-size="14" font-weight="700" text-anchor="middle">com o kit · casos reais até ~350 W</text>

    <!-- barra 1: de fabrica -->
    <text x="80" y="126" fill="#D3DAE0" font-size="15" font-weight="600">De fábrica (modo do fabricante): ≈ 110 W</text>
    <rect x="80" y="138" width="440" height="40" rx="8" fill="#2A3138"/>
    <text x="96" y="164" fill="#B5BEC5" font-size="14">≈ 110 W · limitado pelo modo do fabricante</text>
    <rect x="520" y="138" width="260" height="40" rx="8" fill="none" stroke="#BAF568" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="650" y="164" fill="#BAF568" font-size="14" font-weight="600" text-anchor="middle">potencial parado</text>

    <!-- barra 2: caminho padrao do app -->
    <text x="80" y="220" fill="#D3DAE0" font-size="15" font-weight="600">Caminho padrão do app: TGP configurável + Dynamic Boost, até o teto original</text>
    <rect x="80" y="232" width="380" height="40" rx="8" fill="#3D5A2C"/>
    <text x="96" y="258" fill="#E8ECEF" font-size="14">TGP base · 95 W</text>
    <rect x="460" y="232" width="220" height="40" fill="#5C8A3A"/>
    <text x="570" y="258" fill="#E8ECEF" font-size="14" text-anchor="middle">TGP configurável · até 150 W</text>
    <rect x="680" y="232" width="100" height="40" rx="8" fill="#BAF568"/>
    <text x="730" y="258" fill="#11161B" font-size="13" font-weight="700" text-anchor="middle">Boost +25</text>

    <!-- barra 3: com o kit -->
    <text x="80" y="314" fill="#D3DAE0" font-size="15" font-weight="600">Com o kit de offset da vBIOS (aba ROM): nesta placa até 250 W; em outras, casos reais passam de 300 W</text>
    <rect x="80" y="326" width="380" height="40" rx="8" fill="#3D5A2C"/>
    <text x="96" y="352" fill="#E8ECEF" font-size="14">TGP base · 95 W</text>
    <rect x="460" y="326" width="220" height="40" fill="#5C8A3A"/>
    <text x="570" y="352" fill="#E8ECEF" font-size="14" text-anchor="middle">TGP configurável · até 150 W</text>
    <rect x="680" y="326" width="100" height="40" rx="8" fill="#BAF568"/>
    <text x="730" y="352" fill="#11161B" font-size="13" font-weight="700" text-anchor="middle">Boost +25</text>
    <rect x="780" y="326" width="700" height="40" rx="8" fill="#D9FF8A"/>
    <text x="1130" y="352" fill="#11161B" font-size="14" font-weight="700" text-anchor="middle">além do teto original · até ~350 W em casos reais</text>
    <rect x="1480" y="326" width="200" height="40" rx="8" fill="none" stroke="#BAF568" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="1580" y="352" fill="#BAF568" font-size="13" font-weight="700" text-anchor="middle">controle até 400 W</text>

    <!-- eixo -->
    <line x1="80" y1="400" x2="1680" y2="400" stroke="#3A434B" stroke-width="2"/>
    <g fill="#8A949C" font-size="13" text-anchor="middle">
      <text x="80" y="424">0 W</text><text x="280" y="424">50</text><text x="480" y="424">100</text><text x="680" y="424">150</text><text x="880" y="424">200</text><text x="1080" y="424">250</text><text x="1280" y="424">300</text><text x="1480" y="424">350</text><text x="1680" y="424">400 W</text>
    </g>

    <!-- notas -->
    <g font-size="13" fill="#8A949C">
      <text x="80" y="456">O kit grava os slots romOverride na chave da classe do driver e reinicia a placa em quente; sem ele, o app nunca passa do teto original.</text>
      <text x="80" y="478">Os números são ilustrativos. O app lê os valores reais do seu notebook pelo driver e pelo controlador do fabricante.</text>
    </g>
  </g>
</svg>
