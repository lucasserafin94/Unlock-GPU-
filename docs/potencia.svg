<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="Faixas de potência de uma GPU de notebook e onde o Unlock GPU atua">
  <rect width="1200" height="430" rx="22" fill="#14191E"/>
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <text x="40" y="52" fill="#E8ECEF" font-size="26" font-weight="700">Onde está o potencial escondido</text>
    <text x="40" y="82" fill="#8A949C" font-size="16">Exemplo: RTX 5090 Laptop (95–150 W + 25 W de Dynamic Boost). A placa aguenta até o teto, mas muitos notebooks rodam abaixo dele.</text>

    <!-- eixo -->
    <line x1="80" y1="330" x2="1120" y2="330" stroke="#3A434B" stroke-width="2"/>
    <g fill="#8A949C" font-size="13" text-anchor="middle">
      <text x="80" y="354">0 W</text><text x="340" y="354">50</text><text x="600" y="354">100</text><text x="860" y="354">150</text><text x="1120" y="354">200 W</text>
    </g>

    <!-- barra: modo atual do notebook -->
    <text x="80" y="128" fill="#D3DAE0" font-size="15" font-weight="600">Como muitos notebooks saem de fábrica (modo silencioso ou equilibrado)</text>
    <rect x="80" y="140" width="574" height="40" rx="8" fill="#2A3138"/>
    <text x="96" y="166" fill="#B5BEC5" font-size="14">≈ 110 W  ·  limitado pelo modo do fabricante</text>
    <rect x="654" y="140" width="336" height="40" rx="8" fill="none" stroke="#BAF568" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="822" y="166" fill="#BAF568" font-size="14" font-weight="600" text-anchor="middle">potencial parado</text>

    <!-- barra: com o Unlock GPU -->
    <text x="80" y="222" fill="#D3DAE0" font-size="15" font-weight="600">Com o Unlock GPU: modo e TGP do fabricante no máximo + offsets testados</text>
    <rect x="80" y="234" width="494" height="40" rx="8" fill="#3D5A2C"/>
    <rect x="574" y="234" width="286" height="40" fill="#5C8A3A"/>
    <rect x="860" y="234" width="130" height="40" rx="8" fill="#BAF568"/>
    <rect x="860" y="234" width="20" height="40" fill="#BAF568"/>
    <text x="96" y="260" fill="#E8ECEF" font-size="14">TGP base · 95 W</text>
    <text x="717" y="260" fill="#E8ECEF" font-size="14" text-anchor="middle">TGP configurável · até 150 W</text>
    <text x="925" y="260" fill="#11161B" font-size="13" font-weight="700" text-anchor="middle">Dynamic Boost +25</text>

    <!-- teto -->
    <line x1="990" y1="112" x2="990" y2="330" stroke="#FF7B72" stroke-width="3"/>
    <text x="980" y="300" fill="#FF7B72" font-size="14" font-weight="700" text-anchor="end">teto da placa (vBIOS) · 175 W</text>
    <text x="980" y="320" fill="#FF9F97" font-size="13" text-anchor="end">o app não passa daqui</text>

    <!-- notas -->
    <g font-size="13" fill="#8A949C">
      <text x="80" y="390">Os números são ilustrativos. O app lê os valores reais do seu notebook pelo driver e pelo controlador do fabricante.</text>
      <text x="80" y="410">Offsets de clock aumentam o desempenho dentro da mesma potência; o ajuste automático mede o ganho real com benchmark.</text>
    </g>
  </g>
</svg>
