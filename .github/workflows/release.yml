# Release do Unlock GPU.
# Disparado por tag v* (ex.: v4.1.0): roda os testes, publica o build
# self-contained (arquivo unico), gera o instalador Inno Setup e sobe os dois
# artefatos para a release da tag. Se a release ja existir (criada manualmente
# com o zip portable), esta action apenas adiciona o instalador.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet run --project app/UnlockGpu.Tests -c Release

      - name: Publish portable (self-contained, single file)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish app/UnlockGpu.App -c Release --self-contained true -p:PublishSingleFile=true -o dist/portable
          New-Item -ItemType Directory -Force -Path dist/portable/config | Out-Null
          Copy-Item config/romoverride-capture.txt dist/portable/config/

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup --no-progress -y
          $ver = "${{ github.ref_name }}".TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" installer/unlock-gpu.iss

      - name: Zip portable build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = "${{ github.ref_name }}".TrimStart('v')
          Compress-Archive -Path dist/portable/* -DestinationPath "dist/UnlockGPU-$ver-portable-win-x64.zip"

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.zip
            installer/output/*.exe
